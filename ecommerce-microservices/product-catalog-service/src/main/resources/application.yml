server:
  port: 8081

spring:
  application:
    name: product-catalog-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/product_catalog_db
    # --- Redis Entegrasyonu ---
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  # --- Keycloak Entegrasyonu ---
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/ecommerce-realm
          jwk-set-uri: http://localhost:8080/realms/ecommerce-realm/protocol/openid-connect/certs

# --- MinIO Object Storage Entegrasyonu ---
minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadminpassword
  bucket-name: product-images

# --- Cache TTL Konfigürasyonu ---
app:
  cache:
    top-products-ttl: 3600    # 1 saat (saniye)
    top-50-products-ttl: 21600 # 6 saat (saniye)
    categories-ttl: 1800      # 30 dakika (saniye)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: DEBUG