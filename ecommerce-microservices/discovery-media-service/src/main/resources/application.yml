server:
  port: 8084
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: discovery-media-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/ecommerce-realm
          jwk-set-uri: http://localhost:8080/realms/ecommerce-realm/protocol/openid-connect/certs
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
app:
  cache:
    reels-feed-ttl: 1800 # 30 dakika (saniye cinsinden)

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadminpassword
  region: us-east-1
  buckets:
    videos: reels-videos
    thumbnails: reels-thumbnails

application:
  clients:
    product-catalog:
      url: http://localhost:8081
    order:
      url: http://localhost:8083

logging:
  level:
    org.springframework.security: DEBUG
    com.ecommerce.media: DEBUG